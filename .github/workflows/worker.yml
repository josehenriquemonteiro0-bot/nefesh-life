name: Publicar serviço de fotos

# Publica o Cloudflare Worker que analisa as fotos das refeições.
# Precisa de 4 segredos em Settings → Secrets and variables → Actions → Secrets:
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, PHOTO_ACCESS_CODE
# Sem eles, o workflow termina sem publicar nada.

on:
  push:
    branches: [main, claude/exciting-goodall-5ha5xw]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # aceita também o nome com erro de digitação usado na configuração inicial
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHTOPIC_API_KEY }}
      ACCESS_CODE: ${{ secrets.PHOTO_ACCESS_CODE }}
    steps:
      - name: Verificar segredos
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ] || [ -z "$ANTHROPIC_API_KEY" ] || [ -z "$ACCESS_CODE" ]; then
            echo "::notice::Faltam segredos (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, ANTHROPIC_API_KEY, PHOTO_ACCESS_CODE). Nada foi publicado."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .
      - uses: actions/checkout@v4
        if: steps.check.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: steps.check.outputs.ready == 'true'
      - run: npx tsc --noEmit
        if: steps.check.outputs.ready == 'true'
      # os segredos colados no GitHub podem trazer espaços ou quebras de linha a mais: limpamos antes de usar
      - name: Limpar espaços dos segredos
        if: steps.check.outputs.ready == 'true'
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID ANTHROPIC_API_KEY ACCESS_CODE; do
            clean="$(trim "${!v}")"
            echo "::add-mask::$clean"
            { echo "$v<<NEFESH_EOF"; echo "$clean"; echo "NEFESH_EOF"; } >> "$GITHUB_ENV"
          done
      - name: Publicar o Worker
        if: steps.check.outputs.ready == 'true'
        run: npx wrangler deploy
      - name: Guardar a chave da Anthropic e o código de acesso no Worker
        if: steps.check.outputs.ready == 'true'
        run: |
          printf '%s' "$ANTHROPIC_API_KEY" | npx wrangler secret put ANTHROPIC_API_KEY
          printf '%s' "$ACCESS_CODE" | npx wrangler secret put ACCESS_CODE
