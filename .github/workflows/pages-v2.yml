name: Publicar app de teste (v2)

# Cópia de teste da v2 no Cloudflare Pages (https://nefesh-life-v2.pages.dev),
# ligada ao servidor de teste nefesh-foto-v2. A versão em uso (GitHub Pages) não muda.
on:
  push:
    branches: [nefesh-life-v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-v2
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          BASE_PATH: /
          VITE_PHOTO_API: https://nefesh-foto-v2.josehenriquemonteiro0.workers.dev
      - name: Limpar espaços dos segredos
        run: |
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          for v in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            clean="$(trim "${!v}")"
            echo "::add-mask::$clean"
            { echo "$v<<NEFESH_EOF"; echo "$clean"; echo "NEFESH_EOF"; } >> "$GITHUB_ENV"
          done
      - name: Criar o projeto (só na primeira vez)
        run: npx --yes wrangler@4.165.0 pages project create nefesh-life-v2 --production-branch main || true
      - name: Publicar
        run: npx --yes wrangler@4.165.0 pages deploy dist --project-name nefesh-life-v2 --branch main --commit-dirty=true
