# Avaliação real da IA da ficha integrativa (notas da consulta e exames): quando é pedida
# ou quando os pedidos à IA da ficha mudam no ramo de desenvolvimento.
# Usa a chave ANTHROPIC_API_KEY dos segredos; custa poucos cêntimos por execução.
name: Avaliação da IA · ficha integrativa

on:
  push:
    branches: [nefesh-life-v2]
    paths: [worker/src/proAI.ts, worker/eval/integ.ts, src/domain/proInteg.ts, .github/workflows/eval-integ.yml]
  workflow_dispatch:
    inputs:
      model:
        description: Modelo
        default: claude-opus-5-5

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY || secrets.ANTHTOPIC_API_KEY }}
      MODEL: ${{ inputs.model || 'claude-opus-5-5' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npx -y tsx eval/integ.ts
      - run: cat eval/relatorio-integ.md >> "$GITHUB_STEP_SUMMARY"
        if: always()
