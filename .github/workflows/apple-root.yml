# Uso único: descarrega o certificado raiz da Apple (App Store) e mostra a impressão digital e o conteúdo.
name: Certificado raiz da Apple
on: workflow_dispatch
permissions:
  contents: read
jobs:
  root:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL -o root.cer https://www.apple.com/certificateauthority/AppleRootCA-G3.cer
          openssl x509 -inform der -in root.cer -noout -subject -issuer -enddate -fingerprint -sha256
          echo "BASE64:"
          base64 -w0 root.cer; echo
