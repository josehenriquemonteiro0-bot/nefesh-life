name = "nefesh-foto"
main = "src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# fase de teste: tudo aberto a todos ("false" no lançamento ativa o Premium)
TEST_MODE = "true"
# endereço da app usado nos links das mensagens (códigos de frasco)
APP_URL = "https://josehenriquemonteiro0-bot.github.io/nefesh-life/"
# Só a app NEFESH Life pode chamar o serviço a partir do navegador
ALLOWED_ORIGIN = "https://josehenriquemonteiro0-bot.github.io,capacitor://localhost"
# NEFESH Life Pro: "true" aprova os profissionais sem a página da equipa (só no servidor de teste)
PRO_AUTO_APPROVE = "false"
MODEL = "claude-opus-5-5"
# limites diários de fotos
DAILY_LIMIT = "15"
IP_LIMIT = "45"
GLOBAL_LIMIT = "200"

# lembretes da toma e aviso de fim da liga (notificações)
[triggers]
crons = ["*/15 * * * *"]

# contadores diários; o id é preenchido pela publicação automática (.github/workflows/worker.yml)
[[kv_namespaces]]
binding = "LIMITS"
id = "KV_ID_PLACEHOLDER"

# voz → texto (Whisper no Workers AI da Cloudflare), para o Coach no iPhone
[ai]
binding = "AI"
